name: Document global state

on:
  push:
    branches:
      - docs/local-state-and-scrollbars

permissions:
  contents: write

concurrency:
  group: document-global-state-${{ github.ref }}
  cancel-in-progress: false

jobs:
  document:
    if: ${{ !contains(github.event.head_commit.message, '[global-state-docs-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout documentation branch
        uses: actions/checkout@v4
        with:
          ref: docs/local-state-and-scrollbars
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply documentation updates
        run: python .github/scripts/document-global-state.py

      - name: Install dependencies
        run: npm ci

      - name: Build documentation
        run: npm run build

      - name: Commit validated documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: add useGlobalState guidance [global-state-docs-applied]"
          git push origin HEAD:docs/local-state-and-scrollbars
