name: PR Agent

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created, edited]

jobs:
  pr-agent:
    name: Review pull requests with PR Agent
    if: >-
      github.event.sender.type != 'Bot' &&
      (github.event_name == 'pull_request' || github.event.issue.pull_request)
    runs-on: ubuntu-latest

    permissions:
      issues: write
      pull-requests: write

    env:
      OPENAI_KEY: ${{ secrets.OPENAI_KEY }}

    steps:
      - name: Run PR Agent
        if: env.OPENAI_KEY != ''
        uses: the-pr-agent/pr-agent@main
        env:
          OPENAI_KEY: ${{ env.OPENAI_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          config.restricted_mode: "true"
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "true"
          github_action_config.auto_improve: "true"

      - name: Explain missing configuration
        if: env.OPENAI_KEY == ''
        run: |
          echo "::warning::PR Agent is installed but OPENAI_KEY is missing. Add it under Settings > Secrets and variables > Actions."
