name: One-time Global Docs Refresh

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: one-time-global-docs-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout documentation branch
        uses: actions/checkout@v4
        with:
          ref: docs-framework-complete-reference
          fetch-depth: 0

      - name: Apply complete documentation refresh
        run: |
          python3 scripts/global_docs_core.py
          python3 scripts/global_docs_platform.py
          python3 scripts/global_docs_features.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate documentation
        run: npm run build

      - name: Remove one-time tooling
        run: |
          rm -f scripts/global_docs_core.py
          rm -f scripts/global_docs_platform.py
          rm -f scripts/global_docs_features.py
          rm -f .github/workflows/one-time-global-docs-refresh.yml
          rmdir scripts 2>/dev/null || true

      - name: Commit refreshed documentation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No documentation changes to commit."
            exit 0
          fi
          git commit -m "docs: complete global framework documentation audit"
          git push origin HEAD:docs-framework-complete-reference
