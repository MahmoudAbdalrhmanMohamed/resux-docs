name: Documentation CI

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout framework source
        uses: actions/checkout@v4
        with:
          repository: MahmoudAbdalrhmanMohamed/resux
          ref: main
          path: .framework/resux
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check documentation navigation coverage
        run: npm run check:navigation

      - name: Check framework documentation parity
        run: npm run check:framework-parity

      - name: Build documentation
        run: npm run build
